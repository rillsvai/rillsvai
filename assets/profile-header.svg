<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">rillsvai profile banner</title>
  <desc id="desc">A dark technical GitHub profile banner for rillsvai.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#101820"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="panel" x1="196" y1="56" x2="1004" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#30363D" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.36"/>

  <g transform="translate(196 56)">
    <rect x="0" y="0" width="808" height="208" rx="14" fill="url(#panel)" stroke="#30363D"/>
    <rect x="0" y="0" width="808" height="42" rx="14" fill="#161B22"/>
    <rect x="0" y="26" width="808" height="16" fill="#161B22"/>
    <circle cx="28" cy="21" r="6" fill="#F85149"/>
    <circle cx="52" cy="21" r="6" fill="#D29922"/>
    <circle cx="76" cy="21" r="6" fill="#3FB950"/>

    <text x="38" y="88" fill="#8B949E" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">kyryl@github:~$</text>
    <text x="278" y="88" fill="#F0F6FC" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">sudo dnf install hire-me</text>
    <text x="38" y="130" fill="#3FB950" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22">Resolving dependencies... done</text>
    <text x="38" y="168" fill="#58A6FF" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22">Status: available</text>
    <rect x="272" y="149" width="13" height="24" fill="#F0F6FC">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
